name: Verify fixed browser session
on:
  push:
    paths:
      - '.devcontainer/**'
      - 'scripts/browser-backend/**'
      - 'scripts/browser-endpoint.mjs'
      - 'src/lib/scraper.ts'
      - '.github/workflows/browser-session.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node_modules/.bin/tsc -p scripts/browser-backend/tsconfig.json
      - run: node scripts/browser-backend/session.test.mjs
      - name: Check the private browser gateway
        run: |
          export AD_PROFILE_DIR="$RUNNER_TEMP/backend-profile"
          xvfb-run -a node scripts/browser-backend/server.mjs &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:4318/health | jq -e '.service == "ad-browser-v1"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4318/scan/11111111-1111-4111-8111-111111111111)" = 403
