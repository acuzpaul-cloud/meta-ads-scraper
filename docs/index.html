<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告素材观察台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182235;font:15px system-ui,sans-serif}header{background:#101e36;color:white;padding:44px max(24px,calc((100% - 1120px)/2))}h1{margin:10px 0;font-size:clamp(32px,6vw,50px)}p{line-height:1.6}header p{color:#cbd5e8}main{max-width:1168px;margin:auto;padding:28px 24px}.controls{display:flex;flex-wrap:wrap;gap:10px}input,select,a.button{font:inherit;padding:11px 13px;border:1px solid #cad3df;border-radius:9px;background:#fff;color:inherit}input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}article{background:#fff;border:1px solid #dbe2ec;border-radius:14px;overflow:hidden}.cover{padding:24px 18px;background:#e6efff;color:#234c92;font-size:23px;font-weight:700}.video{background:#ece6ff;color:#53388e}.image{background:#def3e9;color:#285b46}.detail{padding:16px 18px}h2{font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}small,#count{color:#4b5b73}a{color:#2455a4}.links{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.links a{color:#dbe9ff}.detail a{display:inline-block;margin-top:15px}button{margin-left:8px;cursor:pointer;border:1px solid #cad3df;border-radius:7px;background:white;padding:5px 9px}.cover{padding:0;min-height:128px;display:grid;place-items:center}.cover img,.cover video{width:100%;height:190px;object-fit:contain;background:#101e36}.meta{margin-top:8px}.detail button{margin:6px 5px 0 0}.detail a{margin-right:8px}button:disabled{opacity:.45} a.download{font-weight:700} .tag{font-size:13px;padding:12px}.scan{padding:20px;border:1px solid #dbe2ec;background:white;border-radius:14px;margin-bottom:23px}.scan details{margin-top:12px}.scan summary{cursor:pointer}.scan .primary{background:#2455a4;color:white;font:inherit;padding:10px 22px;margin:0}.scan p:empty{display:none}dialog{border:1px solid #dbe2ec;border-radius:14px;padding:24px;width:min(440px,calc(100% - 32px))}dialog::backdrop{background:#101e3666}dialog input{width:100%}.landing{margin-top:10px;padding:8px 0;border-top:1px solid #e2e8f0;overflow-wrap:anywhere}.landing a{margin-top:0}.landing details a{display:block;margin-top:6px}.landing .product-button{display:inline-flex;align-items:center;border:1px solid #cad3df;border-radius:7px;padding:6px 10px;text-decoration:none;font-size:13px}.landing .product-button:hover{background:#edf3ff}.batch-bar{margin-top:16px}.batch-bar button{margin:0 6px 5px 0}.grid article{position:relative}.card-picker{position:absolute;z-index:2;top:9px;left:9px;width:38px;height:38px;display:grid;place-items:center;border:1px solid #aebbd0;border-radius:9px;background:white;cursor:pointer;box-shadow:0 2px 7px #15223a33}.card-picker input{min-width:0;width:19px;height:19px;margin:0;padding:0;accent-color:#2455a4;cursor:pointer}</style>
<header><small style="color:#aaceff">META ADS · 样本预览</small><h1>广告素材观察台</h1><p>先收集所有素材类型，再按关键词、国家或类型筛选。搜索仅筛选已发布数据，上方「查询」获取新广告，下方筛选已加载结果。</p><div class="links"><a href="https://github.com/acuzpaul-cloud/meta-ads-scraper/actions/runs/45736803076">查看样本来源</a></div></header>
<main><form id="scan" class="scan"><h2>查询新广告</h2><div class="controls"><input id="keywords" required maxlength="500" placeholder="输入关键词，多个词用英文逗号分隔" aria-label="查询关键词"><select id="scope" aria-label="查询国家"><option value="ALL">全部国家</option></select><button class="primary" type="submit">查询</button></div><p id="scanStatus" role="status"></p></form><dialog id="auth"><form method="dialog"><h2>首次查询验证</h2><p>输入仅授权此仓库 Actions 读写的 Token。关闭页面后不会保留。</p><input id="token" type="password" autocomplete="off" placeholder="GitHub Token" aria-label="GitHub Token" autofocus><p><button value="cancel">取消</button><button value="continue">继续查询</button></p></form></dialog><h2>筛选已加载的结果</h2><div class="controls"><input id="q" aria-label="搜索" placeholder="搜索关键词、广告文案、广告主或 Library ID"><select id="brand" aria-label="采集关键词"><option value="">全部采集关键词</option><option value="povison">Povison</option><option value="homary">Homary</option></select><select id="country" aria-label="扫描国家"><option value="">全部地区</option></select><select id="kind" aria-label="素材类型"><option value="">全部素材类型</option><option value="carousel">轮播</option><option value="image">图片</option><option value="video">视频</option></select><select id="saved" aria-label="收藏状态"><option value="">全部记录</option><option value="1">仅收藏</option></select></div><div class="batch-bar"><button id="batchMode" type="button" aria-pressed="false">批量下载</button><span id="batchTools" hidden><button id="all" type="button">全选当前结果</button><button id="clear" type="button">清空已选</button><button id="batch" type="button" disabled>下载已选 ZIP</button></span> <span id="notice" role="status"></span></div><p id="count" role="status"></p><section id="grid" class="grid" aria-label="广告卡片"></section></main>
<script src="./jszip.min.js" defer></script><script>
const sample=[["povison","27388585100751616","Povison-Smart","carousel"],["povison","1563439102094595","Povison-Smart","carousel"],["povison","969106176151412","Povison-sofa","carousel"],["povison","1584975723066116","Povison-Canada","video"],["povison","1576589117337503","Povison-Canada","carousel"],["povison","1352185660437175","Povison-Smart","carousel"],["povison","905220269000542","Povison-sofa","video"],["povison","1561911542205093","POVISON","video"],["povison","997457320010033","Povison-sofa","carousel"],["povison","1000754482867367","Povison-Smart","carousel"],["povison","3825092040963934","POVISON","carousel"],["povison","1627607445416697","Povison-sofa","carousel"],["povison","1933129324018005","Povison-sofa","carousel"],["povison","1808615893650179","Povison-sofa","carousel"],["povison","1751903079284925","Povison-sofa","carousel"],["povison","1758098911913612","Povison-Smart","carousel"],["povison","1035826281508440","POVISON","carousel"],["povison","1579967343793805","Povison-Smart","carousel"],["povison","2262512994570596","Povison-Canada","video"],["povison","28184551577896262","Povison-Canada","carousel"],["povison","1323628626504554","POVISON","carousel"],["povison","2155419755038802","POVISON","carousel"],["povison","2322136634993160","Povison-Canada","video"],["povison","1604753834625517","Povison Australia","carousel"],["povison","1443946877794297","Povison-Canada","carousel"],["povison","1386248933653358","Povison Australia","carousel"],["povison","27307820405546614","POVISON","video"],["povison","1649025756886036","Povison-Smart","video"],["povison","2574492136349316","Povison-sofa","carousel"],["povison","2149270198978821","Povison-Smart","carousel"],["homary","1169213828471833","Homary","carousel"],["homary","1011440008412500","Homary","carousel"],["homary","2443012162873877","Homary","carousel"],["homary","28404119789273795","Homary","carousel"],["homary","1849717855563843","Homary","image"],["homary","937252745313723","Homary","carousel"],["homary","1598854368036450","Homary","carousel"],["homary","908198618572787","Chef's Deal Restaurant Equipment Company","carousel"],["homary","1624834962190275","Homary","carousel"],["homary","1901371827154872","Homary","image"],["homary","1608651327065915","Homary","carousel"],["homary","2076111160449039","Homary","carousel"],["homary","764898103120086","Homary","carousel"],["homary","1358527822909269","Homary","carousel"],["homary","1778475003166978","Homary","carousel"],["homary","894578103361603","Homary","carousel"],["homary","833879879479473","Homary","video"],["homary","1474166477374415","Homary","carousel"],["homary","1107405095159915","Homary","image"],["homary","826000150553887","Homary","image"],["homary","1979651005977285","Chef's Deal Restaurant Equipment Company","carousel"],["homary","1399894928280254","Homary","image"],["homary","1581825353523057","Homary","carousel"],["homary","3158708864313667","Homary","carousel"],["homary","1612437053350818","Homary","carousel"],["homary","1325590179723882","Homary","carousel"],["homary","914169014939346","Homary","carousel"],["homary","1608251026945332","Homary","carousel"],["homary","1021874767314946","Homary","carousel"],["homary","1055998937406620","Homary","video"]];
let rows=sample.map(([key,id,name,type])=>({id,name,type,keywords:[key],countries:['ALL'],media:[]}));
const types={image:'图片',video:'视频',carousel:'轮播',multi_video:'多视频',meme:'图片'};
const $=id=>document.getElementById(id), selected=new Set();let favorites=new Set(),found=[],batchMode=false,batchBusy=false;
try{favorites=new Set(JSON.parse(localStorage.getItem('meta-preview-favorites')||'[]'))}catch{}
const region=new Intl.DisplayNames(['zh-CN'],{type:'region',fallback:'code'});
const countryLabel=c=>c==='ALL'?'不限国家':region.of(c);
const productAds=new Map(),mediaAds=new Map();
function productKey(raw){
 try{
  const url=new URL(raw);
  if(!['http:','https:'].includes(url.protocol)||!(/\/(item|products|product|dp|p)\/[^/]/i).test(url.pathname))return null;
  const host=url.hostname.toLowerCase().replace(/^www\./,'');
  const homary=/(^|\.)homary\.com$/.test(host)&&url.pathname.match(/-(\d+)\.html$/i);
  return homary?'homary.com/item/'+homary[1]:host+url.pathname.replace(/\/+$/,'').replace(/\/amp$/i,'');
 }catch{return null}
}
function indexCounts(records){
 productAds.clear();mediaAds.clear();
 function add(map,key,id){if(!key)return;if(!map.has(key))map.set(key,new Set());map.get(key).add(id)}
 for(const row of records){
  for(const url of [...(row.landingPages||[]),...(row.media||[]).map(m=>m.landingPage)])add(productAds,productKey(url),row.id);
  for(const m of row.media||[])add(mediaAds,m.sha256,row.id);
 }
}
function updateBatchControls(){
 $('count').textContent='显示 '+found.length+' / '+rows.length+' 条'+(batchMode?' · 已选 '+selected.size+' 张':'');
 $('batchMode').textContent=batchMode?'退出选择':'批量下载';
 $('batchMode').setAttribute('aria-pressed',String(batchMode));
 $('batchMode').disabled=batchBusy;
 $('batchTools').hidden=!batchMode;
 $('all').disabled=batchBusy||!found.some(a=>a.media.length&&!selected.has(a.id));
 $('clear').disabled=batchBusy||!selected.size;
 $('batch').disabled=batchBusy||!selected.size;
 for(const box of $('grid').querySelectorAll('.card-picker input'))box.disabled=batchBusy;
}
function render(){
const q=$('q').value.trim().toLowerCase();
found=rows.filter(a=>(!$('brand').value||a.keywords.includes($('brand').value))&&(!$('country').value||a.countries.includes($('country').value))&&(!$('kind').value||a.type===$('kind').value)&&(!$('saved').value||favorites.has(a.id))&&[a.id,a.name,a.headline,a.body,...a.keywords].join(' ').toLowerCase().includes(q));
updateBatchControls();
$('grid').replaceChildren(...found.map(a=>{
const el=document.createElement('article');
el.innerHTML='<div class="cover"></div><div class="detail"><h2></h2><small></small><div class="meta"></div><a target="_blank" rel="noopener noreferrer">查看原广告 ↗</a><div class="buttons"></div></div>';
const cover=el.querySelector('.cover'), buttons=el.querySelector('.buttons');
const items=a.media;let idx=0;
function show(){
 const m=items[idx];
 if(!m){cover.innerHTML='<span class="tag">未归档原素材</span>';return}
 const media=document.createElement(m.kind==='video'?'video':'img');media.src=m.file;
 if(m.kind==='video'){media.controls=true;media.preload='none';media.playsInline=true;const poster=items.find(x=>x.kind==='image');if(poster)media.poster=poster.file}
 else{media.loading='lazy';media.alt=a.name+'广告素材'}
 cover.replaceChildren(media);
}
show();
el.querySelector('h2').textContent=a.name;
el.querySelector('small').textContent='Library ID '+a.id;
el.querySelector('.meta').textContent=(types[a.type]||a.type)+(a.countries.some(c=>c!=='ALL')?' · 查询地区 '+a.countries.filter(c=>c!=='ALL').map(countryLabel).join(' / '):'');
const start=document.createElement('div');start.className='meta';
const stamp=a.startedAt&&new Date(a.startedAt);
start.textContent='开始投放 '+(stamp&&!Number.isNaN(stamp.getTime())?stamp.toISOString().slice(0,10):'未获取');
el.querySelector('.meta').after(start);
const duration=document.createElement('div');duration.className='meta';
const days=a.daysRunning;
duration.textContent='投放天数 '+(Number.isFinite(days)?days.toLocaleString('zh-CN')+' 天':'未获取');
start.after(duration);
const counts=[['原帖点赞',a.postEngagement?.likes],['评论',a.postEngagement?.comments],['分享',a.postEngagement?.shares]].filter(([,n])=>Number.isSafeInteger(n)&&n>=0);
if(counts.length){
 const engagement=document.createElement('div');engagement.className='meta';
 engagement.textContent=counts.map(([label,n])=>label+' '+n.toLocaleString('zh-CN')).join(' · ');
 duration.after(engagement);
}
el.querySelector('a').href='https://www.facebook.com/ads/library/?id='+a.id;
function validUrl(raw){try{const url=new URL(raw);return ['https:','http:'].includes(url.protocol)&&!url.username&&!url.password?url:null}catch{return null}}
const links=[...new Map((a.landingPages||[]).map(validUrl).filter(Boolean).map(url=>[url.origin+url.pathname.replace(/\/$/,''),url])).values()];
const product=url=>/\/(item|products|product|dp|p)\/[^/]/i.test(url.pathname)||/\/(gp\/product)\/[^/]/i.test(url.pathname);
const products=links.filter(product);
const section=document.createElement('div');section.className='landing';
const productButton=document.createElement('a');
productButton.className='product-button';productButton.textContent='查看产品';
productButton.target='_blank';productButton.rel='noopener noreferrer';
section.append(productButton);buttons.before(section);
const signals=document.createElement('div');signals.className='meta';signals.title='仅统计当前已采集样本。素材复用按完全相同的文件统计，并排除本条广告。';section.after(signals);
function showLanding(){
 const exact=validUrl(items[idx]?.landingPage);
 const target=exact&&product(exact)?exact:products[0];
 section.hidden=!target;
 if(target)productButton.href=target.href;
 else productButton.removeAttribute('href');
 const same=target?productAds.get(productKey(target))?.size:null;
 const reused=items[idx]?.sha256?Math.max(0,(mediaAds.get(items[idx].sha256)?.size||1)-1):null;
 signals.textContent=[same==null?'':'同款广告 '+same+' 条',reused==null?'':'素材复用 '+reused+' 次'].filter(Boolean).join(' · ');
 signals.hidden=!signals.textContent;
}
showLanding();
if(batchMode&&items.length){
 const picker=document.createElement('label');picker.className='card-picker';
 const check=document.createElement('input');check.type='checkbox';check.disabled=batchBusy;check.checked=selected.has(a.id);
 check.setAttribute('aria-label','选择广告 '+a.name+' '+a.id);
 check.onchange=()=>{if(check.checked)selected.add(a.id);else selected.delete(a.id);updateBatchControls()};
 picker.append(check);el.prepend(picker);
}

function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;buttons.append(b);return b}
const fav=button(favorites.has(a.id)?'已收藏':'收藏',()=>{if(favorites.has(a.id))favorites.delete(a.id);else favorites.add(a.id);try{localStorage.setItem('meta-preview-favorites',JSON.stringify([...favorites]))}catch{}render()});
if(items.length){
 if(items.length===1){const dl=document.createElement('a');dl.className='download';dl.textContent='下载素材';dl.href=items[0].file;dl.download=items[0].file.split('/').pop();buttons.append(dl)}
 else {
 const dl=button('下载全部 '+items.length+' 个素材',async()=>{dl.disabled=true;try{await downloadZip(items,'ad-'+a.id+'.zip',true)}catch(e){$('notice').textContent=e.message;dl.textContent='下载失败，点击重试';return}finally{dl.disabled=false}dl.textContent='下载全部 '+items.length+' 个素材'});
 const next=button('下一张 · 1/'+items.length,()=>{idx=(idx+1)%items.length;show();showLanding();next.textContent='下一张 · '+(idx+1)+'/'+items.length});
 }
}else button('暂无可下载素材',()=>{}).disabled=true;
return el}));
}
for(const id of ['q','brand','country','kind','saved'])$(id).addEventListener('input',render);
$('batchMode').onclick=()=>{batchMode=!batchMode;if(!batchMode)selected.clear();render()};
$('all').onclick=()=>{found.filter(a=>a.media.length).forEach(a=>selected.add(a.id));render()};
$('clear').onclick=()=>{selected.clear();render()};
$('batch').onclick=async()=>{
 const items=rows.filter(a=>selected.has(a.id)).flatMap(a=>a.media);
 if(!batchMode||batchBusy||!items.length)return;
 batchBusy=true;updateBatchControls();
 try{await downloadZip(items,'meta-ad-creatives.zip')}catch(e){$('notice').textContent=e.message}finally{batchBusy=false;updateBatchControls()}
};
async function downloadZip(items,filename,requireAll=false){
 if(!window.JSZip)throw Error('ZIP 模块尚未发布');
 const zip=new JSZip();let failures=0;
 for(const [i,m] of items.entries()){ $('notice').textContent='正在打包 '+(i+1)+'/'+items.length;try{const r=await fetch(m.file);if(!r.ok)throw Error();zip.file(m.file.split('/').pop(),await r.blob())}catch{failures++}}
 if(failures===items.length)throw Error('没有可下载文件');
 if(requireAll && failures)throw Error(failures+' 个素材加载失败，未下载不完整的 ZIP。请重试。');
 const url=URL.createObjectURL(await zip.generateAsync({type:'blob'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 $('notice').textContent='已打包 '+(items.length-failures)+' 个文件'+(failures?'，'+failures+' 个失败':'');
}
$('auth').addEventListener('close',()=>{if($('auth').returnValue==='continue'&&$('token').value.trim())$('scan').requestSubmit();else $('token').value='';});
const scope=$('scope');
const countries=[];for(let a=65;a<=90;a++)for(let b=65;b<=90;b++){const code=String.fromCharCode(a,b),label=region.of(code);if(label!==code&&code!=='EU'&&code!=='UN')countries.push([code,label])}
for(const [code,label] of countries.sort((a,b)=>a[1].localeCompare(b[1],'zh-CN')))scope.add(new Option(label,code));
$('scan').onsubmit=async e=>{
 e.preventDefault();
 const token=$('token').value.trim(), msg=$('scanStatus'), button=$('scan').querySelector('button[type=submit]');
 if(!token){$('auth').returnValue='';$('auth').showModal();return}
 const keywords=[...new Set($('keywords').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))];
 if(!keywords.length||keywords.length>8||keywords.some(k=>k.length>100)){msg.textContent='请输入 1–8 个关键词，每个最多 100 个字符。';return}
 const requestId=crypto.randomUUID();
 button.disabled=true;msg.textContent='正在提交查询…';
 try{
 const response=await fetch('https://api.github.com/repos/acuzpaul-cloud/meta-ads-scraper/actions/workflows/ads-pages.yml/dispatches',{method:'POST',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({ref:'master',inputs:{keywords:keywords.join(','),countries:scope.value,request_id:requestId}}),signal:AbortSignal.timeout(20000)});
 if(!response.ok)throw Error('GitHub 未接受查询（HTTP '+response.status+'）。请检查 Token 权限或任务是否启用。');
 msg.textContent='查询已提交，正在等待 GitHub 采集和发布，通常需几分钟。发布后本页会自动刷新结果。';
 const dispatch=response.status===200?await response.json().catch(()=>null):null;
 let runId=dispatch?.workflow_run_id;
 for(let i=0;i<180;i++){
 await new Promise(r=>setTimeout(r,8000));
 if(i%3===1){
 const api='https://api.github.com/repos/acuzpaul-cloud/meta-ads-scraper/actions';
 if(!runId){const list=await fetch(api+'/workflows/ads-pages.yml/runs?event=workflow_dispatch&per_page=15',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(10000)}).then(r=>r.ok?r.json():null).catch(()=>null);runId=list?.workflow_runs?.find(r=>r.display_title==='Dashboard scan '+requestId)?.id;}
 if(runId){
 const run=await fetch('https://api.github.com/repos/acuzpaul-cloud/meta-ads-scraper/actions/runs/'+runId,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(10000)}).then(r=>r.ok?r.json():null).catch(()=>null);
 if(run?.status==='completed'&&run.conclusion!=='success')throw Error('GitHub 任务未成功（'+run.conclusion+'），请重试。');
 }
 }
 const data=await fetch('./ads.json?check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(7000)}).then(r=>r.ok?r.json():null).catch(()=>null);
 if(data?.requestId===requestId){selected.clear();for(const id of ['q','brand','country','kind','saved'])$(id).value='';await init(data);msg.textContent='查询完成，已加载 '+data.ads.length+' 条广告。';return}
 }
 msg.textContent='暂未检测到本次发布，请稍后刷新页面。';
 }catch(err){msg.textContent=err.message}finally{button.disabled=false}
};
async function init(published){
 try{const data=published||await fetch('./ads.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});if(!Array.isArray(data.ads))throw Error();rows=data.ads;$('notice').textContent='已加载已发布素材'}catch{$('notice').textContent='当前是旧版样本，尚未发布原素材'}
 function options(id,values,label){$(id).options.length=1;for(const v of [...new Set(values)].sort())$(id).add(new Option(label(v),v))}
 indexCounts(rows);
 options('brand',rows.flatMap(a=>a.keywords),v=>v);options('country',rows.flatMap(a=>a.countries),countryLabel);render();
}
init();
</script></html>
