<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告素材观察台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182235;font:15px system-ui,sans-serif}header{background:#101e36;color:white;padding:44px max(24px,calc((100% - 1120px)/2))}h1{margin:10px 0;font-size:clamp(32px,6vw,50px)}p{line-height:1.6}header p{color:#cbd5e8}main{max-width:1168px;margin:auto;padding:28px 24px}.controls{display:flex;flex-wrap:wrap;gap:10px}input,select,a.button{font:inherit;padding:11px 13px;border:1px solid #cad3df;border-radius:9px;background:#fff;color:inherit}input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}article{background:#fff;border:1px solid #dbe2ec;border-radius:14px;overflow:hidden}.cover{padding:24px 18px;background:#e6efff;color:#234c92;font-size:23px;font-weight:700}.video{background:#ece6ff;color:#53388e}.image{background:#def3e9;color:#285b46}.detail{padding:16px 18px}h2{font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}small,#count{color:#4b5b73}a{color:#2455a4}.links{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.links a{color:#dbe9ff}.detail a{display:inline-block;margin-top:15px}button{margin-left:8px;cursor:pointer;border:1px solid #cad3df;border-radius:7px;background:white;padding:5px 9px}</style>
<header><small style="color:#aaceff">META ADS · 样本预览</small><h1>广告素材观察台</h1><p>用 GitHub 实测数据预览广告卡片。搜索和筛选只处理当前样本，不会触发新扫描。类型色块是占位，不是原广告封面。</p><div class="links"><a href="https://github.com/acuzpaul-cloud/meta-ads-scraper/actions/runs/45736803076">查看样本来源</a></div></header>
<main><div class="controls"><input id="q" aria-label="搜索" placeholder="搜索广告主或 Library ID"><select id="brand" aria-label="采集关键词"><option value="">全部采集关键词</option><option value="povison">Povison</option><option value="homary">Homary</option></select><select id="kind" aria-label="素材类型"><option value="">全部素材类型</option><option value="carousel">轮播</option><option value="image">图片</option><option value="video">视频</option></select><select id="saved" aria-label="收藏状态"><option value="">全部记录</option><option value="1">仅收藏</option></select></div><p id="count" role="status"></p><section id="grid" class="grid" aria-label="广告卡片"></section></main>
<script>

homary","1598854368036450","Homary","carousel"],["homary","908198618572787","Chef's Deal Restaurant Equipment Company","carousel"],["homary","1624834962190275","Homary","carousel"],["homary","1901371827154872","Homary","image"],["homary","1608651327065915","Homary","carousel"],["homary","2076111160449039","Homary","carousel"],["homary","764898103120086","Homary","carousel"],["homary","1358527822909269","Homary","carousel"],["homary","1778475003166978","Homary","carousel"],["homary","894578103361603","Homary","carousel"],["homary","833879879479473","Homary","video"],["homary","1474166477374415","Homary","carousel"],["homary","1107405095159915","Homary","image"],["homary","826000150553887","Homary","image"],["homary","1979651005977285","Chef's Deal Restaurant Equipment Company","carousel"],["homary","1399894928280254","Homary","image"],["homary","1581825353523057","Homary","carousel"],["homary","3158708864313667","Homary","carousel"],["homary","1612437053350818","Homary","carousel"],["homary","1325590179723882","Homary","carousel"],["homary","914169014939346","Homary","carousel"],["homary","1608251026945332","Homary","carousel"],["homary","1021874767314946","Homary","carousel"],["homary","1055998937406620","Homary","video"]], types={carousel:'轮播',image:'图片',video:'视频'};
const $=id=>document.getElementById(id);let favorites=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem('meta-preview-favorites')||'[]'))}catch{}
function render(){
const query=$('q').value.trim().toLowerCase();
const found=rows.filter(([key,id,name,type])=>(!$('brand').value||key===$('brand').value)&&(!$('kind').value||type===$('kind').value)&&(!$('saved').value||favorites.has(id))&&(name.toLowerCase().includes(query)||id.includes(query)));
$('count').textContent=found.length?'显示 '+found.length+' / '+rows.length+' 条样本':'没有符合筛选条件的记录';
$('grid').replaceChildren(...found.map(([key,id,name,type])=>{
const el=document.createElement('article');
el.innerHTML='<div class="cover"></div><div class="detail"><h2></h2><small></small><br><a target="_blank" rel="noopener noreferrer">查看原广告 ↗</a><button type="button"></button></div>';
const cover=el.querySelector('.cover');cover.classList.add(type);cover.textContent=types[type];
el.querySelector('h2').textContent=name;
el.querySelector('small').textContent='Library ID '+id;
el.querySelector('a').href='https://www.facebook.com/ads/library/?id='+encodeURIComponent(id);
const b=el.querySelector('button');b.textContent=favorites.has(id)?'已收藏':'收藏';b.setAttribute('aria-pressed',String(favorites.has(id)));b.onclick=()=>{if(favorites.has(id))favorites.delete(id);else favorites.add(id);try{localStorage.setItem('meta-preview-favorites',JSON.stringify([...favorites]))}catch{}render()};
return el}));
}
for(const id of ['q','brand','kind','saved'])$(id).addEventListener('input',render);
render();
</script></html>
