<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告素材观察台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182235;font:15px system-ui,sans-serif}header{background:#101e36;color:white;padding:44px max(24px,calc((100% - 1120px)/2))}h1{margin:10px 0;font-size:clamp(32px,6vw,50px)}p{line-height:1.6}header p{color:#cbd5e8}main{max-width:1168px;margin:auto;padding:28px 24px}.controls{display:flex;flex-wrap:wrap;gap:10px}input,select,a.button{font:inherit;padding:11px 13px;border:1px solid #cad3df;border-radius:9px;background:#fff;color:inherit}input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}article{background:#fff;border:1px solid #dbe2ec;border-radius:14px;overflow:hidden}.cover{padding:24px 18px;background:#e6efff;color:#234c92;font-size:23px;font-weight:700}.video{background:#ece6ff;color:#53388e}.image{background:#def3e9;color:#285b46}.detail{padding:16px 18px}h2{font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}small,#count{color:#4b5b73}a{color:#2455a4}.links{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.links a{color:#dbe9ff}.detail a{display:inline-block;margin-top:15px}button{margin-left:8px;cursor:pointer;border:1px solid #cad3df;border-radius:7px;background:white;padding:5px 9px}.cover{padding:0;min-height:128px;display:grid;place-items:center}.cover img,.cover video{width:100%;height:190px;object-fit:contain;background:#101e36}.meta{margin-top:8px}.detail button{margin:6px 5px 0 0}.detail a{margin-right:8px}button:disabled{opacity:.45} a.download{font-weight:700} .tag{font-size:13px;padding:12px}</style>
<header><small style="color:#aaceff">META ADS · 样本预览</small><h1>广告素材观察台</h1><p>先收集所有素材类型，再按关键词、国家或类型筛选。搜索仅筛选已发布数据，新增采集请运行 GitHub Actions。</p><div class="links"><a href="https://github.com/acuzpaul-cloud/meta-ads-scraper/actions/runs/45736803076">查看样本来源</a></div></header>
<main><div class="controls"><input id="q" aria-label="搜索" placeholder="搜索关键词、广告文案、广告主或 Library ID"><select id="brand" aria-label="采集关键词"><option value="">全部采集关键词</option><option value="povison">Povison</option><option value="homary">Homary</option></select><select id="country" aria-label="扫描国家"><option value="">全部地区</option></select><select id="kind" aria-label="素材类型"><option value="">全部素材类型</option><option value="carousel">轮播</option><option value="image">图片</option><option value="video">视频</option></select><select id="saved" aria-label="收藏状态"><option value="">全部记录</option><option value="1">仅收藏</option></select></div><p><button id="all">勾选当前结果</button><button id="clear">清空已选</button><button id="batch" disabled>批量下载 ZIP</button> <span id="notice" role="status"></span></p><p id="count" role="status"></p><section id="grid" class="grid" aria-label="广告卡片"></section></main>
<script src="./jszip.min.js" defer></script><script>
const sample=[["povison","27388585100751616","Povison-Smart","carousel"],["povison","1563439102094595","Povison-Smart","carousel"],["povison","969106176151412","Povison-sofa","carousel"],["povison","1584975723066116","Povison-Canada","video"],["povison","1576589117337503","Povison-Canada","carousel"],["povison","1352185660437175","Povison-Smart","carousel"],["povison","905220269000542","Povison-sofa","video"],["povison","1561911542205093","POVISON","video"],["povison","997457320010033","Povison-sofa","carousel"],["povison","1000754482867367","Povison-Smart","carousel"],["povison","3825092040963934","POVISON","carousel"],["povison","1627607445416697","Povison-sofa","carousel"],["povison","1933129324018005","Povison-sofa","carousel"],["povison","1808615893650179","Povison-sofa","carousel"],["povison","1751903079284925","Povison-sofa","carousel"],["povison","1758098911913612","Povison-Smart","carousel"],["povison","1035826281508440","POVISON","carousel"],["povison","1579967343793805","Povison-Smart","carousel"],["povison","2262512994570596","Povison-Canada","video"],["povison","28184551577896262","Povison-Canada","carousel"],["povison","1323628626504554","POVISON","carousel"],["povison","2155419755038802","POVISON","carousel"],["povison","2322136634993160","Povison-Canada","video"],["povison","1604753834625517","Povison Australia","carousel"],["povison","1443946877794297","Povison-Canada","carousel"],["povison","1386248933653358","Povison Australia","carousel"],["povison","27307820405546614","POVISON","video"],["povison","1649025756886036","Povison-Smart","video"],["povison","2574492136349316","Povison-sofa","carousel"],["povison","2149270198978821","Povison-Smart","carousel"],["homary","1169213828471833","Homary","carousel"],["homary","1011440008412500","Homary","carousel"],["homary","2443012162873877","Homary","carousel"],["homary","28404119789273795","Homary","carousel"],["homary","1849717855563843","Homary","image"],["homary","937252745313723","Homary","carousel"],["homary","1598854368036450","Homary","carousel"],["homary","908198618572787","Chef's Deal Restaurant Equipment Company","carousel"],["homary","1624834962190275","Homary","carousel"],["homary","1901371827154872","Homary","image"],["homary","1608651327065915","Homary","carousel"],["homary","2076111160449039","Homary","carousel"],["homary","764898103120086","Homary","carousel"],["homary","1358527822909269","Homary","carousel"],["homary","1778475003166978","Homary","carousel"],["homary","894578103361603","Homary","carousel"],["homary","833879879479473","Homary","video"],["homary","1474166477374415","Homary","carousel"],["homary","1107405095159915","Homary","image"],["homary","826000150553887","Homary","image"],["homary","1979651005977285","Chef's Deal Restaurant Equipment Company","carousel"],["homary","1399894928280254","Homary","image"],["homary","1581825353523057","Homary","carousel"],["homary","3158708864313667","Homary","carousel"],["homary","1612437053350818","Homary","carousel"],["homary","1325590179723882","Homary","carousel"],["homary","914169014939346","Homary","carousel"],["homary","1608251026945332","Homary","carousel"],["homary","1021874767314946","Homary","carousel"],["homary","1055998937406620","Homary","video"]];
let rows=sample.map(([key,id,name,type])=>({id,name,type,keywords:[key],countries:['ALL'],media:[]}));
const types={image:'图片',video:'视频',carousel:'轮播',multi_video:'多视频',meme:'图片'};
const $=id=>document.getElementById(id), selected=new Set();let favorites=new Set(),found=[];
try{favorites=new Set(JSON.parse(localStorage.getItem('meta-preview-favorites')||'[]'))}catch{}
const region=new Intl.DisplayNames(['zh-CN'],{type:'region',fallback:'code'});
const countryLabel=c=>c==='ALL'?'全球扫描（国家未细分）':region.of(c);
function render(){
const q=$('q').value.trim().toLowerCase();
found=rows.filter(a=>(!$('brand').value||a.keywords.includes($('brand').value))&&(!$('country').value||a.countries.includes($('country').value))&&(!$('kind').value||a.type===$('kind').value)&&(!$('saved').value||favorites.has(a.id))&&[a.id,a.name,a.headline,a.body,...a.keywords].join(' ').toLowerCase().includes(q));
$('count').textContent='显示 '+found.length+' / '+rows.length+' 条 · 已选 '+selected.size+' 张';
$('batch').disabled=!selected.size;
$('grid').replaceChildren(...found.map(a=>{
const el=document.createElement('article');
el.innerHTML='<div class="cover"></div><div class="detail"><h2></h2><small></small><div class="meta"></div><a target="_blank" rel="noopener noreferrer">查看原广告 ↗</a><div class="buttons"></div></div>';
const cover=el.querySelector('.cover'), buttons=el.querySelector('.buttons');
const items=a.media;let idx=0;
function show(){
 const m=items[idx];
 if(!m){cover.innerHTML='<span class="tag">未归档原素材</span>';return}
 const media=document.createElement(m.kind==='video'?'video':'img');media.src=m.file;
 if(m.kind==='video'){media.controls=true;media.preload='none';media.playsInline=true;const poster=items.find(x=>x.kind==='image');if(poster)media.poster=poster.file}
 else{media.loading='lazy';media.alt=a.name+'广告素材'}
 cover.replaceChildren(media);
}
show();
el.querySelector('h2').textContent=a.name;
el.querySelector('small').textContent='Library ID '+a.id;
el.querySelector('.meta').textContent=(types[a.type]||a.type)+' · '+a.countries.map(countryLabel).join(' / ');
el.querySelector('a').href='https://www.facebook.com/ads/library/?id='+a.id;
const check=document.createElement('input');check.type='checkbox';check.disabled=!items.length;check.checked=selected.has(a.id);check.setAttribute('aria-label','选择 '+a.name);check.onchange=()=>{if(check.checked)selected.add(a.id);else selected.delete(a.id);$('count').textContent='显示 '+found.length+' / '+rows.length+' 条 · 已选 '+selected.size+' 张';$('batch').disabled=!selected.size};buttons.append(check);
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;buttons.append(b);return b}
const fav=button(favorites.has(a.id)?'已收藏':'收藏',()=>{if(favorites.has(a.id))favorites.delete(a.id);else favorites.add(a.id);try{localStorage.setItem('meta-preview-favorites',JSON.stringify([...favorites]))}catch{}render()});
if(items.length){const dl=document.createElement('a');dl.className='download';dl.textContent='下载当前素材';buttons.append(dl);
 function sync(){dl.href=items[idx].file;dl.download=items[idx].file.split('/').pop()}sync();
 if(items.length>1){const next=button('下一张 · 1/'+items.length,()=>{idx=(idx+1)%items.length;show();sync();next.textContent='下一张 · '+(idx+1)+'/'+items.length})}
}else button('暂无可下载素材',()=>{}).disabled=true;
return el}));
}
for(const id of ['q','brand','country','kind','saved'])$(id).addEventListener('input',render);
$('all').onclick=()=>{found.filter(a=>a.media.length).forEach(a=>selected.add(a.id));render()};
$('clear').onclick=()=>{selected.clear();render()};
$('batch').onclick=async()=>{
 const items=rows.filter(a=>selected.has(a.id)).flatMap(a=>a.media);
 $('batch').disabled=true;
 try{
 if(!window.JSZip)throw Error('ZIP 模块尚未发布');
 const zip=new JSZip();let failures=0;
 for(const [i,m] of items.entries()){ $('notice').textContent='正在打包 '+(i+1)+'/'+items.length;try{const r=await fetch(m.file);if(!r.ok)throw Error();zip.file(m.file.split('/').pop(),await r.blob())}catch{failures++}}
 if(failures===items.length)throw Error('没有可下载文件');
 const url=URL.createObjectURL(await zip.generateAsync({type:'blob'}));const a=document.createElement('a');a.href=url;a.download='meta-ad-creatives.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 $('notice').textContent='已打包 '+(items.length-failures)+' 个文件'+(failures?'，'+failures+' 个失败':'');
 }catch(e){$('notice').textContent=e.message}finally{$('batch').disabled=!selected.size}
};
async function init(){
 try{const r=await fetch('./ads.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data.ads))throw Error();rows=data.ads;$('notice').textContent='已加载已发布素材'}catch{$('notice').textContent='当前是旧版样本，尚未发布原素材'}
 function options(id,values,label){$(id).options.length=1;for(const v of [...new Set(values)].sort())$(id).add(new Option(label(v),v))}
 options('brand',rows.flatMap(a=>a.keywords),v=>v);options('country',rows.flatMap(a=>a.countries),countryLabel);render();
}
init();
</script></html>
