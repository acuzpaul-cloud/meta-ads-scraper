<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告素材观察台</title><style>

{margin-top:10px;padding:8px 0;border-top:1px solid #e2e8f0;overflow-wrap:anywhere}.landing a{margin-top:0}.landing details a{display:block;margin-top:6px}.landing .product-button{display:inline-flex;align-items:center;border:1px solid #cad3df;border-radius:7px;padding:6px 10px;text-decoration:none;font-size:13px}.landing .product-button:hover{background:#edf3ff}.batch-bar{margin-top:16px}.batch-bar button{margin:0 6px 5px 0}.grid article{position:relative}.card-picker{position:absolute;z-index:2;top:9px;left:9px;width:38px;height:38px;display:grid;place-items:center;border:1px solid #aebbd0;border-radius:9px;background:white;cursor:pointer;box-shadow:0 2px 7px #15223a33}.card-picker input{min-width:0;width:19px;height:19px;margin:0;padding:0;accent-color:#2455a4;cursor:pointer}.query-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#101e3680;padding:20px}.query-overlay[hidden]{display:none}.query-overlay-box{background:#fff;border-radius:16px;padding:28px;text-align:center;width:min(360px,100%);box-shadow:0 12px 40px #101e3633}.query-spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dbe7fa;border-top-color:#2455a4;border-radius:50%;animation:query-spin .85s linear infinite}.query-overlay-box p{margin:8px 0 0;color:#4b5b73}@keyframes query-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.query-spinner{animation:none}}</style>
<header><small style="color:#aaceff">META ADS · 样本预览</small><h1>广告素材观察台</h1><p>先收集所有素材类型，再按关键词、国家或类型筛选。搜索仅筛选已发布数据，在本页查询新广告，完成后自动载入素材卡片。</p><div class="links"><a href="https://github.com/acuzpaul-cloud/meta-ads-scraper/actions/runs/45736803076">查看样本来源</a></div></header>
<main><form id="scan" class="scan"><h2>查询新广告</h2><div class="controls"><input id="keywords" required maxlength="500" placeholder="输入关键词，例如 Homary 或 dining table" aria-label="查询关键词"><select id="scope" aria-label="查询国家"><option value="ALL">全部国家</option></select><button class="primary" type="submit">查询</button></div><p id="scanStatus" role="status"></p></form><details class="scan" id="us-spend-calc"><summary>美国花费估算工具（免费）</summary><p>美国竞品广告没有公开花费。只有拿到同一条广告在美国、同一统计周期的预估展示量或链接点击量，才适合算区间。成本区间可参考你自己的美国同类广告。此处不读取或改写任何卡片数据。</p>
<form id="spend-scenario"><div class="controls"><select id="spend-basis" aria-label="计算口径"><option value="impressions">预估展示量 × CPM</option><option value="clicks">预估链接点击 × CPC</option></select><input id="spend-volume" type="number" step="1" min="1" required placeholder="预估展示次数" aria-label="预估展示次数"></div><p class="controls"><input id="spend-low" type="number" min="0.01" step="0.01" required placeholder="最低 CPM（美元）" aria-label="最低 CPM（美元）"><input id="spend-high" type="number" min="0.01" step="0.01" required placeholder="最高 CPM（美元）" aria-label="最高 CPM（美元）"><button class="primary" type="submit">计算区间</button></p><output id="spend-result" role="status"></output></form></details><h2>筛选已加载的结果</h2><div class="controls"><input id="q" aria-label="搜索" placeholder="搜索关键词、广告文案、广告主或 Library ID"><select id="brand" aria-label="采集关键词"><option value="">全部采集关键词</option></select><select id="country" aria-label="扫描国家"><option value="">全部地区</option></select><select id="kind" aria-label="素材类型"><option value="">全部素材类型</option><option value="carousel">轮播</option><option value="image">图片</option><option value="video">视频</option></select><select id="saved" aria-label="收藏状态"><option value="">全部记录</option><option value="1">仅收藏</option></select></div><div class="batch-bar"><button id="batchMode" type="button" aria-pressed="false">批量下载</button><span id="batchTools" hidden><button id="all" type="button">全选当前结果</button><button id="clear" type="button">清空已选</button><button id="batch" type="button" disabled>下载已选 ZIP</button></span> <span id="notice" role="status"></span></div><p id="count" role="status"></p><section id="grid" class="grid" aria-label="广告卡片"></section></main><div id="queryOverlay" class="query-overlay" hidden><div class="query-overlay-box" role="status" aria-live="polite"><div class="query-spinner" aria-hidden="true"></div><strong>加载中</strong><p id="queryProgress">正在提交查询…</p></div></div>
<script src="./jszip.min.js" defer></script><script>
let rows=[];
const types={image:'图片',video:'视频',carousel:'轮播',multi_video:'多视频',meme:'图片'};
const $=id=>document.getElementById(id), selected=new Set();let favorites=new Set(),found=[],batchMode=false,batchBusy=false;
try{favorites=new Set(JSON.parse(localStorage.getItem('meta-preview-favorites')||'[]'))}catch{}
const region=new Intl.DisplayNames(['zh-CN'],{type:'region',fallback:'code'});
const countryLabel=c=>c==='ALL'?'不限国家':region.of(c);
const productAds=new Map(),mediaAds=new Map();
function productKey(raw){
 try{
  const url=new URL(raw);
  if(!['http:','https:'].includes(url.protocol)||!(/\/(item|products|product|dp|p)\/[^/]/i).test(url.pathname))return null;
  const host=url.hostname.toLowerCase().replace(/^www\./,'');
  const homary=/(^|\.)homary\.com$/.test(host)&&url.pathname.match(/-(\d+)\.html$/i);
  return homary?'homary.com/item/'+homary[1]:host+url.pathname.replace(/\/+$/,'').replace(/\/amp$/i,'');
 }catch{return null}
}
function indexCounts(records){
 productAds.clear();mediaAds.clear();
 function add(map,key,id){if(!key)return;if(!map.has(key))map.set(key,new Set());map.get(key).add(id)}
 for(const row of records){
  for(const url of [...(row.landingPages||[]),...(row.media||[]).map(m=>m.landingPage)])add(productAds,productKey(url),row.id);
  for(const m of row.media||[])add(mediaAds,m.sha256,row.id);
 }
}
function updateBatchControls(){
 $('count').textContent='显示 '+found.length+' / '+rows.length+' 条'+(batchMode?' · 已选 '+selected.size+' 张':'');
 $('batchMode').textContent=batchMode?'退出选择':'批量下载';
 $('batchMode').setAttribute('aria-pressed',String(batchMode));
 $('batchMode').disabled=batchBusy;
 $('batchTools').hidden=!batchMode;
 $('all').disabled=batchBusy||!found.some(a=>a.media.length&&!selected.has(a.id));
 $('clear').disabled=batchBusy||!selected.size;
 $('batch').disabled=batchBusy||!selected.size;
 for(const box of $('grid').querySelectorAll('.card-picker input'))box.disabled=batchBusy;
}
function render(){
const q=$('q').value.trim().toLowerCase();
found=rows.filter(a=>(!$('brand').value||a.keywords.includes($('brand').value))&&(!$('country').value||a.countries.includes($('country').value))&&(!$('kind').value||a.type===$('kind').value)&&(!$('saved').value||favorites.has(a.id))&&[a.id,a.name,a.headline,a.body,...a.keywords].join(' ').toLowerCase().includes(q));
updateBatchControls();
const cards=document.createDocumentFragment();
for(const a of found){
const el=document.createElement('article');
el.innerHTML='<div class="cover"></div><div class="detail"><h2></h2><small></small><div class="meta"></div><a target="_blank" rel="noopener noreferrer">查看原广告 ↗</a><div class="buttons"></div></div>';
const cover=el.querySelector('.cover'), buttons=el.querySelector('.buttons');
const items=a.media;let idx=0;
function show(){
 const m=items[idx];
 if(!m){cover.innerHTML='<span class="tag">未归档原素材</span>';return}
 const media=document.createElement(m.kind==='video'?'video':'img');media.src=m.file;
 if(m.kind==='video'){media.controls=true;media.preload='none';media.playsInline=true;const poster=items.find(x=>x.kind==='image');if(poster)media.poster=poster.file}
 else{media.loading='lazy';media.alt=a.name+'广告素材'}
 cover.replaceChildren(media);
}
show();
el.querySelector('h2').textContent=a.name;
el.querySelector('small').textContent='Library ID '+a.id;
el.querySelector('.meta').textContent=types[a.type]||a.type;
const geo=document.createElement('div');geo.className='meta';
const matched=(a.countries||[]).filter(c=>c!=='ALL');
geo.textContent=matched.length?'推广地区 '+matched.map(countryLabel).join(' / '):'推广地区 未细分';
geo.title='查询命中的国家，不代表广告的完整投放范围。';
el.querySelector('.meta').append(geo);
const start=document.createElement('div');start.className='meta';
const stamp=a.startedAt&&new Date(a.startedAt);
start.textContent='开始投放 '+(stamp&&!Number.isNaN(stamp.getTime())?stamp.toISOString().slice(0,10):'未获取');
el.querySelector('.meta').after(start);
const duration=document.createElement('div');duration.className='meta';
const days=a.daysRunning;
duration.textContent='投放天数 '+(Number.isFinite(days)?days.toLocaleString('zh-CN')+' 天':'未获取');
start.after(duration);
const metrics=document.createElement('div');metrics.className='meta delivery-numbers';
const spend=a.spendEstimate;
const priced=spend?.scope==='EU_UK'&&spend.currency==='EUR'&&Number.isFinite(spend.amount)&&spend.amount>0;
const reach=Number.isFinite(a.reach)&&a.reach>0?a.reach:null;
const spendLine=document.createElement('div');spendLine.textContent=priced?'预估花费（欧盟及英国） '+new Intl.NumberFormat('zh-CN',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(spend.amount):'预估花费 · 无数据';
if(priced)spendLine.title='来源 AdSpendSpy，累计模型估算，不是广告主实际支出';
const reachLine=document.createElement('div');reachLine.textContent=reach===null?'覆盖人数 · 无数据':'Meta 公开覆盖 '+reach.toLocaleString('zh-CN')+' 人';
if(reach!==null)reachLine.title='Meta 披露的数据，不等于美国或全球覆盖人数';
if(priced)metrics.append(spendLine);
if(reach!==null)metrics.append(reachLine);
if(metrics.childElementCount)duration.after(metrics);
const counts=[['原帖点赞',a.postEngagement?.likes],['评论',a.postEngagement?.comments],['分享',a.postEngagement?.shares]].filter(([,n])=>Number.isSafeInteger(n)&&n>=0);
if(counts.length){
 const engagement=document.createElement('div');engagement.className='meta';
 engagement.textContent=counts.map(([label,n])=>label+' '+n.toLocaleString('zh-CN')).join(' · ');
 duration.after(engagement);
}
el.querySelector('a').href='https://www.facebook.com/ads/library/?id='+a.id;
function validUrl(raw){try{const url=new URL(raw);return ['https:','http:'].includes(url.protocol)&&!url.username&&!url.password?url:null}catch{return null}}
const links=[...new Map((a.landingPages||[]).map(validUrl).filter(Boolean).map(url=>[url.origin+url.pathname.replace(/\/$/,''),url])).values()];
const product=url=>/\/(item|products|product|dp|p)\/[^/]/i.test(url.pathname)||/\/(gp\/product)\/[^/]/i.test(url.pathname);
const products=links.filter(product);
const section=document.createElement('div');section.className='landing';
const productButton=document.createElement('a');
productButton.className='product-button';productButton.textContent='查看产品';
productButton.target='_blank';productButton.rel='noopener noreferrer';
section.append(productButton);buttons.before(section);
const signals=document.createElement('div');signals.className='meta';signals.title='仅统计当前已采集样本。素材复用按完全相同的文件统计，并排除本条广告。';section.after(signals);
function showLanding(){
 const exact=validUrl(items[idx]?.landingPage);
 const target=exact&&product(exact)?exact:products[0];
 section.hidden=!target;
 if(target)productButton.href=target.href;
 else productButton.removeAttribute('href');
 const same=target?productAds.get(productKey(target))?.size:null;
 const reused=items[idx]?.sha256?Math.max(0,(mediaAds.get(items[idx].sha256)?.size||1)-1):null;
 signals.textContent=[same==null?'':'同款广告 '+same+' 条',reused==null?'':'素材复用 '+reused+' 次'].filter(Boolean).join(' · ');
 signals.hidden=!signals.textContent;
}
showLanding();
if(batchMode&&items.length){
 const picker=document.createElement('label');picker.className='card-picker';
 const check=document.createElement('input');check.type='checkbox';check.disabled=batchBusy;check.checked=selected.has(a.id);
 check.setAttribute('aria-label','选择广告 '+a.name+' '+a.id);
 check.onchange=()=>{if(check.checked)selected.add(a.id);else selected.delete(a.id);updateBatchControls()};
 picker.append(check);el.prepend(picker);
}

function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;buttons.append(b);return b}
const fav=button(favorites.has(a.id)?'已收藏':'收藏',()=>{if(favorites.has(a.id))favorites.delete(a.id);else favorites.add(a.id);try{localStorage.setItem('meta-preview-favorites',JSON.stringify([...favorites]))}catch{}render()});
if(items.length){
 if(items.length===1){const dl=document.createElement('a');dl.className='download';dl.textContent='下载素材';dl.href=items[0].file;dl.download=items[0].file.split('/').pop();buttons.append(dl)}
 else {
 const dl=button('下载全部 '+items.length+' 个素材',async()=>{dl.disabled=true;try{await downloadZip(items,'ad-'+a.id+'.zip',true)}catch(e){$('notice').textContent=e.message;dl.textContent='下载失败，点击重试';return}finally{dl.disabled=false}dl.textContent='下载全部 '+items.length+' 个素材'});
 const next=button('下一张 · 1/'+items.length,()=>{idx=(idx+1)%items.length;show();showLanding();next.textContent='下一张 · '+(idx+1)+'/'+items.length});
 }
}else button('暂无可下载素材',()=>{}).disabled=true;
cards.append(el);
}
$('grid').replaceChildren(cards);
}
for(const id of ['q','brand','country','kind','saved'])$(id).addEventListener('input',render);
$('batchMode').onclick=()=>{batchMode=!batchMode;if(!batchMode)selected.clear();render()};
$('all').onclick=()=>{found.filter(a=>a.media.length).forEach(a=>selected.add(a.id));render()};
$('clear').onclick=()=>{selected.clear();render()};
$('batch').onclick=async()=>{
 const items=rows.filter(a=>selected.has(a.id)).flatMap(a=>a.media);
 if(!batchMode||batchBusy||!items.length)return;
 batchBusy=true;updateBatchControls();
 try{await downloadZip(items,'meta-ad-creatives.zip')}catch(e){$('notice').textContent=e.message}finally{batchBusy=false;updateBatchControls()}
};
async function downloadZip(items,filename,requireAll=false){
 if(!window.JSZip)throw Error('ZIP 模块尚未发布');
 const zip=new JSZip();let failures=0;
 for(const [i,m] of items.entries()){ $('notice').textContent='正在打包 '+(i+1)+'/'+items.length;try{const r=await fetch(m.file);if(!r.ok)throw Error();zip.file(m.file.split('/').pop(),await r.blob())}catch{failures++}}
 if(failures===items.length)throw Error('没有可下载文件');
 if(requireAll && failures)throw Error(failures+' 个素材加载失败，未下载不完整的 ZIP。请重试。');
 const url=URL.createObjectURL(await zip.generateAsync({type:'blob'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 $('notice').textContent='已打包 '+(items.length-failures)+' 个文件'+(failures?'，'+failures+' 个失败':'');
}
const scope=$('scope');
const countryCodes='BR IN GB US CA AR AU AT BE CL CN CO HR DK DO EG FI FR DE GR HK ID IE IL IT JP JO KW LB MY MX NL NZ NG NO PK PA PE PH PL RU SA RS SG ZA KR ES SE CH TW TH TR AE VE PT LU BG CZ SI IS SK LT TT BD LK KE HU MA CY JM EC RO BO GT CR QA SV HN NI PY UY PR BA PS TN BH VN GH MU UA MT BS MV OM MK LV EE IQ DZ AL NP MO ME SN GE BN UG GP BB AZ TZ LY MQ CM BW ET KZ NA MG NC MD FJ BY JE GU YE ZM IM HT KH AW PF AF BM GY AM MW AG RW GG GM FO LC KY BJ AD GD VI BZ VC MN MZ ML AO GF UZ DJ BF MC TG GL GA GI CD KG PG BT KN SZ LS LA LI MP SR SC VG TC DM MR AX SM SL NE CG AI YT CV GN TM BI TJ VU SB ER WS AS FK GQ TO KM PW FM CF SO MH VA TD KI ST TV NR RE LR ZW CI MM AN AQ BQ BV IO CX CC CK CW GS GW HM XK MS NU NF PN BL SH MF PM SX SS SJ TL TK UM WF EH SY'.split(' ');
const countries=countryCodes.map(code=>[code,countryLabel(code)]);
for(const [code,label] of countries.sort((a,b)=>a[1].localeCompare(b[1],'zh-CN')))scope.add(new Option(label,code));
$('scan').onsubmit=async e=>{
 e.preventDefault();
 const keywords=$('keywords').value.trim(),msg=$('scanStatus');
 if(!keywords){msg.textContent='请输入关键词。';return}
 const base='https://tucoiva-ad-query.acuzpaul-cloud.workers.dev';
 const button=$('scan').querySelector('button[type=submit]');
 button.disabled=true;
 const overlay=$('queryOverlay'),main=document.querySelector('main');
 const progress=label=>{msg.textContent=label;$('queryProgress').textContent=label};
 progress('正在提交查询…');overlay.hidden=false;main.inert=true;
 try{
  const r=await fetch(base+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keywords,country:scope.value}),signal:AbortSignal.timeout(22000)});
  const sent=await r.json();
  if(!r.ok||!sent.requestId){
   const errors={NOT_CONFIGURED:'查询服务正在配置中，暂时不能启动新采集。',INVALID_INPUT:'请检查关键词格式。多个关键词用逗号分隔，每次最多 8 个。',GITHUB_REJECTED:'GitHub 未接受采集任务（'+(sent.upstreamStatus||r.status)+'）。'};
   throw Error(errors[sent.error]||'查询服务暂时不可用。');
  }
  const labels={waiting:'等待任务启动',queued:'正在排队',in_progress:'正在采集并发布',completed:'采集完成，正在等待页面更新'};
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const deadline=Date.now()+32*60*1000;let n=0;
  progress('查询已提交，正在等待任务启动。');
  while(Date.now()<deadline){
   await pause(8000);
   const data=await fetch('./ads.json?check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(7000)}).then(r=>r.ok?r.json():null).catch(()=>null);
   if(data?.requestId===sent.requestId){
    selected.clear();for(const id of ['q','brand','country','kind','saved'])$(id).value='';
    await init(data);
    msg.textContent=(data.scans?.some(s=>s.partial||s.stop==='NO_MORE_RESULTS_OBSERVED')?'未确认翻完，已加载 ':'查询完成，已加载 ')+data.ads.length+' 条广告。';
    return;
   }
   if(n++%2===0){
    const status=await fetch(base+'/status?requestId='+encodeURIComponent(sent.requestId),{signal:AbortSignal.timeout(15000)}).then(r=>r.ok?r.json():null).catch(()=>null);
    if(status?.status==='completed'&&status.conclusion!=='success')throw Error('本次采集未成功（'+status.conclusion+'），已保留原有广告。');
    if(labels[status?.status])progress(labels[status.status]+'…');
   }
  }
  msg.textContent='本次等待已超时，当前结果保持不变。';
 }catch(error){msg.textContent=error.message||'查询未完成，请重试。'}finally{overlay.hidden=true;main.inert=false;button.disabled=false}
};
function updateSpendInputs(){
 const isCpm=$('spend-basis').value==='impressions';
 const names={ 'spend-volume':isCpm?'预估展示次数':'预估链接点击次数', 'spend-low':isCpm?'最低 CPM（美元）':'最低 CPC（美元）', 'spend-high':isCpm?'最高 CPM（美元）':'最高 CPC（美元）' };
 for(const [id,label] of Object.entries(names)){$(id).placeholder=label;$(id).setAttribute('aria-label',label);$(id).value=''}
 $('spend-result').textContent='';
}
$('spend-basis').addEventListener('change',updateSpendInputs);
$('spend-scenario').addEventListener('input',()=>{$('spend-result').textContent=''});
$('spend-scenario').addEventListener('submit',e=>{
 e.preventDefault();
 const volume=$('spend-volume').valueAsNumber,lo=$('spend-low').valueAsNumber,hi=$('spend-high').valueAsNumber;
 const output=$('spend-result');
 if(![volume,lo,hi].every(x=>Number.isFinite(x)&&x>0)||hi<lo){output.textContent='请输入有效的数据，最高成本不能低于最低成本。';return}
 const units=volume/($('spend-basis').value==='impressions'?1000:1);
 if(!Number.isFinite(units*hi)){output.textContent='输入值过大。';return}
 const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
 output.textContent='情景花费 '+usd.format(units*lo)+' – '+usd.format(units*hi)+'，不是竞品实际花费。';
});
async function init(published){
 try{const data=published||await fetch('./ads.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});if(!Array.isArray(data.ads))throw Error();rows=data.ads;$('notice').textContent=(data.scans?.some(s=>s.partial||s.stop==='NO_MORE_RESULTS_OBSERVED')?'未确认翻完 · 以下为已采集结果':(rows.length?'已加载已发布素材':'暂无已发布广告'))}catch{$('notice').textContent='暂时无法加载广告结果，请刷新重试'}
 function options(id,values,label){$(id).options.length=1;for(const v of [...new Set(values)])$(id).add(new Option(label(v),v))}
 indexCounts(rows);
 options('brand',rows.flatMap(a=>a.keywords),v=>v);options('country',[...countryCodes,...rows.flatMap(a=>a.countries).filter(c=>c!=='ALL')].sort((a,b)=>countryLabel(a).localeCompare(countryLabel(b),'zh-CN')),countryLabel);render();
}
init();
</script></html>
